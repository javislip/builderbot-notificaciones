version: '3.8'

services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: builderbot-whatsapp
    restart: unless-stopped
    ports:
      - "${PORT:-3008}:3008"
    environment:
      - PORT=3008
      - TZ=${TZ:-America/Caracas}
      - API_KEY=${API_KEY}
      - QR_PATH=${QR_PATH}

    volumes:
      - whatsapp_bot_sessions:/app/bot_sessions

volumes:
  whatsapp_bot_sessions:
    driver: local
